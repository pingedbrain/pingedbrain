name: profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0f766e&color_dots=#ebedf0,#99f6e4,#2dd4bf,#14b8a6,#0f766e
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf
      - name: Publish to output branch
        run: |
          # snk writes dist/ as root, so publish from a copy we own.
          mkdir out && cp dist/*.svg out/ && cd out
          git init -q -b output
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" output

  pings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refresh latest merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Public repos only, so private work never lands on the profile.
          # Show ministack and Rig upstream contributions plus my own repos; skip work CI noise.
          gh search prs --author "${{ github.repository_owner }}" --merged --visibility public \
            --sort updated --limit 50 --json title,url,repository,closedAt \
            --jq '[.[] | select(.repository.nameWithOwner == "ministackorg/ministack"
                     or (.repository.nameWithOwner | startswith("0xPlaygrounds/"))
                     or (.repository.nameWithOwner | startswith("${{ github.repository_owner }}/")))]
                  | sort_by(.closedAt) | reverse | .[:5][]
                  | "- [`\(.repository.nameWithOwner)`](\(.url)) \(.title)"' > pings.md
          [ -s pings.md ] || exit 0
          awk 'FNR==NR{p=p $0 "\n"; next}
               /<!--PINGS:START-->/{print; printf "%s", p; skip=1; next}
               /<!--PINGS:END-->/{skip=0}
               !skip' pings.md README.md > README.new
          mv README.new README.md
          git diff --quiet && exit 0
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qam "chore: refresh latest pings"
          git push
